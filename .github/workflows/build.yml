name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev
          pip install buildozer "cython==0.29.36"
      - name: Compilar APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          code=$?
          echo "Codigo de salida: $code"
          if [ $code -ne 0 ]; then
            echo "===== ULTIMAS 80 LINEAS ====="
            tail -80 build.log
            exit $code
          fi
      - name: Firmar el APK con la llave fija
        run: |
          APKSIGNER=$(find ~/.buildozer/android/platform -path "*build-tools*" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          for f in bin/*.apk; do
            "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$f"
            echo "===== FIRMA de $f ====="
            "$APKSIGNER" verify --print-certs "$f" | head -4
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            bin/*.apk
            build.log
